server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

spring:
  config:
    # Enables `mvn spring-boot:run` from backend/ to read the sole local config file.
    import: optional:file:../.env[.properties]
  application:
    name: pv-platform-backend
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: ${CACHE_REDIS_TTL:600000}
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/pv_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${MYSQL_VALIDATION_TIMEOUT:3000}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:20}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
      idle-timeout: ${MYSQL_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${MYSQL_POOL_MAX_LIFETIME:1800000}
  sql:
    init:
      # init.sql 包含 DROP TABLE，仅用于人工初始化，禁止应用启动时自动执行。
      mode: never
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
          starttls:
            enable: false
          from: ${MAIL_FROM:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

model-service:
  base-url: ${MODEL_SERVICE_BASE_URL:http://localhost:9000}
  response-timeout-seconds: ${MODEL_SERVICE_RESPONSE_TIMEOUT_SECONDS:120}

analysis:
  llm:
    enabled: ${ANALYSIS_LLM_ENABLED:true}
    provider: ${ANALYSIS_LLM_PROVIDER:deepseek}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    temperature: ${DEEPSEEK_TEMPERATURE:0.2}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
    timeout-ms: ${DEEPSEEK_TIMEOUT_MS:60000}
    json-mode: ${DEEPSEEK_JSON_MODE:true}

pv-data:
  import:
    storage-dir: ${PV_IMPORT_STORAGE_DIR:./data/pv-imports}
    max-file-size: ${PV_IMPORT_MAX_FILE_SIZE:10485760}
    max-rows: ${PV_IMPORT_MAX_ROWS:100000}

weather:
  # LOCAL is available for local development without a third-party key.
  # Use QWEATHER with JWT credentials for real third-party weather calls.
  provider: ${WEATHER_PROVIDER:LOCAL}
  auth-type: ${WEATHER_AUTH_TYPE:JWT}
  api-key: ${WEATHER_API_KEY:}
  base-url: ${WEATHER_BASE_URL:https://devapi.qweather.com}
  connect-timeout: ${WEATHER_CONNECT_TIMEOUT:3000}
  response-timeout: ${WEATHER_RESPONSE_TIMEOUT:5000}
  cache-minutes: ${WEATHER_CACHE_MINUTES:10}
  forecast-days: ${WEATHER_FORECAST_DAYS:3}
  qweather-project-id: ${QWEATHER_PROJECT_ID:}
  qweather-key-id: ${QWEATHER_KEY_ID:}
  qweather-private-key-path: ${QWEATHER_PRIVATE_KEY_PATH:}
  jwt-ttl-seconds: ${WEATHER_JWT_TTL_SECONDS:1800}

news:
  sync:
    enabled: ${NEWS_SYNC_ENABLED:false}
    web-cron: ${NEWS_SYNC_WEB_CRON:0 20 */6 * * *}
    weather-cron: ${NEWS_SYNC_WEATHER_CRON:0 */20 * * * *}
    mem-enabled: ${NEWS_SYNC_MEM_ENABLED:true}
    nea-enabled: ${NEWS_SYNC_NEA_ENABLED:true}
    longi-enabled: ${NEWS_SYNC_LONGI_ENABLED:true}
    weather-enabled: ${NEWS_SYNC_WEATHER_ENABLED:true}
    connect-timeout-ms: ${NEWS_SYNC_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${NEWS_SYNC_READ_TIMEOUT_MS:8000}
    max-items-per-source: ${NEWS_SYNC_MAX_ITEMS_PER_SOURCE:10}

pvoutput:
  enabled: ${PVOUTPUT_ENABLED:true}
  api-key: ${PVOUTPUT_API_KEY:}
  auth-system-id: ${PVOUTPUT_AUTH_SYSTEM_ID:}
  base-url: ${PVOUTPUT_BASE_URL:https://pvoutput.org/service/r2}
  sync-interval-ms: ${PVOUTPUT_SYNC_INTERVAL_MS:600000}
  initial-delay-ms: ${PVOUTPUT_INITIAL_DELAY_MS:30000}

security:
  debug-open: ${SECURITY_DEBUG_OPEN:false}
  jwt:
    secret: ${JWT_SECRET:pv-platform-dev-jwt-secret-do-not-use-in-production!!}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:7200}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  verification:
    code-expire-minutes: ${VERIFY_CODE_EXPIRE_MINUTES:5}
    code-length: ${VERIFY_CODE_LENGTH:6}
    max-attempts: ${VERIFY_CODE_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${VERIFY_CODE_RESEND_COOLDOWN_SECONDS:60}
    max-daily-sends: ${VERIFY_CODE_MAX_DAILY_SENDS:20}

redis:
  enabled: ${REDIS_ENABLED:false}

oauth:
  # Frontend address used after a completed OAuth login, e.g. https://app.example.com
  callback-base-url: ${OAUTH_CALLBACK_BASE_URL:http://localhost:5173}
  # Public backend origin registered in GitHub OAuth App, e.g. https://api.example.com.
  # Leave empty locally to retain http://localhost:${SERVER_PORT}/... callback behavior.
  backend-callback-base-url: ${OAUTH_BACKEND_CALLBACK_BASE_URL:}
  providers:
    github:
      enabled: ${OAUTH_GITHUB_ENABLED:false}
      client-id: ${OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
      authorize-url: https://github.com/login/oauth/authorize
      token-url: https://github.com/login/oauth/access_token
      user-info-url: https://api.github.com/user
      scopes: read:user
    # WeChat and QQ are reserved for future implementation

face:
  provider: ${FACE_PROVIDER:local}
  match-threshold: ${FACE_MATCH_THRESHOLD:75}
  temp-url-expire-seconds: ${FACE_TEMP_URL_EXPIRE_SECONDS:300}
  storage-dir: ${FACE_STORAGE_DIR:./data/faces}
  aliyun:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    face-region: ${ALIYUN_FACE_REGION:cn-shanghai}
    face-endpoint: ${ALIYUN_FACE_ENDPOINT:facebody.cn-shanghai.aliyuncs.com}
    face-db-name: ${ALIYUN_FACE_DB_NAME:pv_platform}
    oss-region: ${ALIYUN_OSS_REGION:cn-shanghai}
    oss-endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    oss-bucket: ${ALIYUN_OSS_BUCKET:}

mail:
  enabled: ${MAIL_ENABLED:false}
  host: ${MAIL_HOST:smtp.qq.com}
  port: ${MAIL_PORT:465}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:}
  ssl-enabled: ${MAIL_SSL_ENABLED:true}

file-storage:
  avatar-dir: ${AVATAR_STORAGE_DIR:./data/avatars}
  avatar-max-size: ${AVATAR_MAX_SIZE:2097152}

oss:
  enabled: ${OSS_ENABLED:false}
  credential-mode: ${OSS_CREDENTIAL_MODE:ACCESS_KEY}
  endpoint: ${OSS_ENDPOINT:${ALIYUN_OSS_ENDPOINT:}}
  region: ${OSS_REGION:${ALIYUN_OSS_REGION:cn-shanghai}}
  bucket-name: ${OSS_BUCKET_NAME:${ALIYUN_OSS_BUCKET:}}
  access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:${ALIYUN_ACCESS_KEY_ID:}}
  access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:${ALIYUN_ACCESS_KEY_SECRET:}}
  ram-role-name: ${OSS_RAM_ROLE_NAME:}
  url-expire-seconds: ${OSS_URL_EXPIRE_SECONDS:600}
  avatar-max-size-mb: ${OSS_AVATAR_MAX_SIZE_MB:2}
  news-image-max-size-mb: ${OSS_NEWS_IMAGE_MAX_SIZE_MB:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

database:
  migration:
    api-usage:
      # Only adds missing api_call_log Token columns and statistics indexes.
      enabled: ${API_USAGE_SCHEMA_MIGRATION_ENABLED:true}
    open-wallet:
      # Creates missing wallet account, recharge order and wallet record tables.
      enabled: ${OPEN_WALLET_SCHEMA_MIGRATION_ENABLED:true}
    oss-news:
      enabled: ${OSS_NEWS_SCHEMA_MIGRATION_ENABLED:true}
