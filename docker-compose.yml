services:
  mysql:
    image: mysql:8.4
    container_name: pv-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: pv_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 以下服务是容器化占位，补齐各目录 Dockerfile 后使用：
  # docker compose --profile full up --build
  backend:
    profiles: ["full"]
    build: ./backend
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/pv_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MODEL_SERVICE_BASE_URL: http://model-service:9000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      model-service:
        condition: service_started

  model-service:
    profiles: ["full"]
    build: ./model-service
    ports:
      - "9000:9000"

  web-frontend:
    profiles: ["full"]
    build: ./web-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
