<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>光伏发电平台 - 登录</title>
<!--
  用户认证前端参考实现，不是生产页面。
  1. 修改下方 apiBase 即可切换后端地址。
  2. GitHub redirectUri 会使用当前页面 URL；GitHub 控制台 callback 仍固定为后端 /api/auth/oauth/github/callback。
  3. 正式项目应将请求、Token 和路由逻辑拆分到 API 层、状态库和路由守卫。
-->
<script>
window.PV_AUTH_CONFIG = {
  apiBase: 'http://localhost:8080/api'
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 system-ui,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a5f);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:12px;padding:32px;width:400px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
h2{text-align:center;color:#1e293b;margin-bottom:24px;font-size:22px}
h3{font-size:14px;color:#64748b;text-align:center;margin-bottom:12px}
.form-group{margin-bottom:16px}
label{display:block;font-weight:600;color:#334155;margin-bottom:4px;font-size:13px}
input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;outline:none;transition:border .2s}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{width:100%;padding:10px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:#2563eb;color:#fff}
.btn-dark{background:#24292e;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-outline{background:#fff;color:#2563eb;border:1px solid #2563eb}
.btn-danger{background:#dc2626;color:#fff}
.divider{display:flex;align-items:center;margin:16px 0;color:#94a3b8;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid #e2e8f0}
.divider span{padding:0 12px}
.error{background:#fef2f2;color:#dc2626;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none}
.success{background:#f0fdf4;color:#16a34a;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none}
.tabs{display:flex;margin-bottom:20px;border-bottom:2px solid #e2e8f0}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer;color:#94a3b8;font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.tab-content{display:none}
.tab-content.active{display:block}
.user-info{background:#f8fafc;border-radius:8px;padding:16px;margin-top:16px}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block;background:#e2e8f0}
.camera-box{text-align:center}
video,canvas{border-radius:8px;max-width:100%;background:#000}
.camera-btns{display:flex;gap:8px;margin-top:8px}
.camera-btns button{flex:1}
.face-manage{margin-top:16px;padding:14px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0}
.face-status{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.status-tag{padding:2px 8px;border-radius:999px;font-size:12px;background:#e2e8f0;color:#64748b}
.status-tag.on{background:#dcfce7;color:#15803d}
.face-note{font-size:12px;color:#64748b;margin:8px 0}
code{font-size:11px;background:#f1f5f9;padding:2px 6px;border-radius:3px;word-break:break-all}
</style>
</head>
<body>
<div class="card" id="app">

<!-- ========== 登录后主页 ========== -->
<div id="page-home" style="display:none">
  <h2>欢迎回来</h2>
  <div class="user-info">
    <img id="home-avatar" class="avatar" src="" alt="头像" onerror="this.style.display='none'">
    <p><strong id="home-name"></strong></p>
    <p style="color:#64748b;font-size:12px">@<span id="home-username"></span></p>
    <p style="color:#64748b;font-size:12px"><span id="home-email"></span></p>
    <p style="font-size:12px;color:#94a3b8;margin-top:8px">角色: <span id="home-roles"></span></p>
  </div>
  <div class="face-manage">
    <div class="face-status">
      <strong>人脸登录</strong>
      <span id="face-status-tag" class="status-tag">检查中</span>
    </div>
    <p id="face-status-text" class="face-note">登录前需要先为当前账号录入人脸。</p>
    <input type="file" id="face-enroll-file" accept="image/jpeg,image/png">
    <button class="btn btn-success" id="face-enroll-btn" onclick="enrollFace()">录入/更新人脸</button>
    <button class="btn btn-danger" id="face-revoke-btn" onclick="revokeFace()" style="display:none">撤销人脸</button>
    <div class="error" id="face-manage-error" style="margin-top:8px"></div>
    <div class="success" id="face-manage-success" style="margin-top:8px"></div>
  </div>
  <button class="btn btn-danger" onclick="doLogout()" style="margin-top:16px">退出登录</button>
  <div class="success" id="home-msg"></div>
</div>

<!-- ========== 登录/注册页 ========== -->
<div id="page-auth">
  <h2>光伏发电综合平台</h2>
  <div class="error" id="auth-error"></div>
  <div class="success" id="auth-success"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">密码登录</div>
    <div class="tab" onclick="switchTab('register')">注册</div>
    <div class="tab" onclick="switchTab('email-tab')">验证码登录</div>
    <div class="tab" onclick="switchTab('face-tab')">人脸登录</div>
  </div>

  <!-- 密码登录 -->
  <div id="tab-login" class="tab-content active">
    <div class="form-group"><label>用户名</label><input id="l-user" placeholder="请输入用户名"></div>
    <div class="form-group"><label>密码</label><input id="l-pass" type="password" placeholder="请输入密码"></div>
    <button class="btn btn-primary" onclick="doPasswordLogin()">登录</button>
  </div>

  <!-- 注册 -->
  <div id="tab-register" class="tab-content">
    <div class="form-group"><label>用户名</label><input id="r-user" placeholder="4-32位"></div>
    <div class="form-group"><label>密码</label><input id="r-pass" type="password" placeholder="至少8位含字母数字"></div>
    <div class="form-group"><label>邮箱(可选)</label><input id="r-email" placeholder="your@email.com"></div>
    <button class="btn btn-primary" onclick="doRegister()">注册</button>
  </div>

  <!-- 验证码登录 -->
  <div id="tab-email-tab" class="tab-content">
    <div class="form-group"><label>邮箱</label><input id="ec-email" placeholder="请输入邮箱"></div>
    <div style="display:flex;gap:8px">
      <input id="ec-code" placeholder="6位验证码" style="flex:1">
      <button class="btn btn-outline" onclick="sendEmailCode()" style="width:120px" id="ec-send-btn">发送验证码</button>
    </div>
    <input id="ec-username" placeholder="用户名(仅注册时填)" style="margin-top:8px">
    <button class="btn btn-primary" onclick="emailCodeLogin()">验证码登录</button>
    <button class="btn btn-success" onclick="emailCodeRegister()" style="margin-top:4px">验证码注册(新用户)</button>
  </div>

  <!-- 人脸登录 -->
  <div id="tab-face-tab" class="tab-content">
    <p class="face-note">请使用已录入人脸的账号。首次使用请先通过其他方式登录并完成人脸录入。</p>
    <div class="camera-box">
      <video id="face-video" autoplay playsinline style="display:none"></video>
      <canvas id="face-canvas" style="display:none"></canvas>
      <p id="face-hint" style="color:#64748b;margin:12px 0">点击下方按钮打开摄像头拍照</p>
      <div class="camera-btns">
        <button class="btn btn-outline" id="face-start-btn" onclick="startCamera()">打开摄像头</button>
        <button class="btn btn-primary" id="face-capture-btn" onclick="captureFace()" style="display:none">拍照登录</button>
      </div>
      <div class="camera-btns" style="margin-top:4px">
        <input type="file" id="face-file" accept="image/jpeg,image/png" onchange="faceFileLogin()">
      </div>
      <div class="error" id="face-login-error" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="divider"><span>或</span></div>

  <!-- GitHub -->
  <button class="btn btn-dark" onclick="githubLogin()" style="margin-bottom:6px">
    <span style="font-size:16px;margin-right:6px">&#9749;</span> GitHub 登录
  </button>

  <!-- 找回密码 -->
  <button class="btn btn-outline" onclick="showForgotPwd()" style="margin-top:0">忘记密码？</button>

  <!-- 找回密码弹窗 -->
  <div id="forgot-box" style="display:none;margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px">
    <h3>找回密码</h3>
    <input id="fp-email" placeholder="注册邮箱">
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="fp-code" placeholder="验证码" style="flex:1">
      <button class="btn btn-outline" onclick="sendForgotCode()" style="width:120px" id="fp-send-btn">发送</button>
    </div>
    <input id="fp-newpw" type="password" placeholder="新密码" style="margin-top:8px">
    <button class="btn btn-success" onclick="resetPassword()" style="margin-top:8px">重置密码</button>
  </div>
</div>

<!-- ========== OAuth 回调页 ========== -->
<div id="page-callback" style="display:none">
  <h2>正在登录...</h2>
  <p style="text-align:center;color:#64748b" id="callback-msg">校验中，请稍候</p>
  <div class="error" id="callback-error"></div>
</div>

</div><!-- /card -->

<script>
var CONFIG=window.PV_AUTH_CONFIG||{};
var API=String(CONFIG.apiBase||'http://localhost:8080/api').replace(/\/$/,'');
var token='', refreshToken='', user=null;
var timerId=null;

// ====== page switching ======
function showPage(id){['page-auth','page-home','page-callback'].forEach(p=>{document.getElementById(p).style.display=p===id?'block':'none'})}
function showMsg(id,msg,isErr){var e=document.getElementById(id);e.textContent=msg;e.style.display='block';setTimeout(function(){e.style.display='none'},3000)}

// ====== tab switching ======
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector('.tab[onclick*="'+name+'"]').classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

// ====== OAuth callback detection ======
(function(){
  var p=new URLSearchParams(location.search);
  // 处理后端回调跳回的 token（GET 回调模式）
  var t=p.get('token'), rt=p.get('refreshToken');
  if(t){
    saveLogin({token:t, refreshToken:rt||''});
    // 清理 URL 上的敏感参数
    history.replaceState(null,'',location.pathname);
    showPage('page-home'); renderHome();
    return;
  }
  // 旧的 POST 回调模式（Mock provider 用）
  var code=p.get('code'), state=p.get('state'), provider=p.get('provider');
  if(code && state){
    showPage('page-callback');
    document.getElementById('callback-msg').textContent='正在校验...';
    var curUrl=location.href.split('?')[0];
    fetch(API+'/auth/oauth/'+(provider||'mock')+'/callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,state:state,redirectUri:curUrl})})
      .then(r=>r.json()).then(d=>{
        if(d.code===200){saveLogin(d.data);history.replaceState(null,'',location.pathname);showPage('page-home');renderHome()}else{document.getElementById('callback-error').style.display='block';document.getElementById('callback-error').textContent=d.message;document.getElementById('callback-msg').textContent='登录失败'}
      }).catch(function(e){document.getElementById('callback-error').style.display='block';document.getElementById('callback-error').textContent='网络错误: '+e.message});
    return;
  }
})()

// ====== auth actions ======
function doPasswordLogin(){
  var u=document.getElementById('l-user').value.trim(),p=document.getElementById('l-pass').value;
  if(!u||!p){showMsg('auth-error','请填写用户名和密码',1);return}
  fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    .then(r=>r.json()).then(d=>{if(d.code===200){saveLogin(d.data);showPage('page-home');renderHome()}else{showMsg('auth-error',d.message,1)}}).catch(function(){showMsg('auth-error','网络错误',1)})
}

function doRegister(){
  var u=document.getElementById('r-user').value.trim(),p=document.getElementById('r-pass').value,em=document.getElementById('r-email').value.trim();
  if(!u||!p){showMsg('auth-error','用户名和密码必填',1);return}
  fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,email:em||null})})
    .then(r=>r.json()).then(d=>{if(d.code===200){showMsg('auth-success','注册成功，切换到登录tab登录');switchTab('login')}else{showMsg('auth-error',d.message,1)}}).catch(function(){showMsg('auth-error','网络错误',1)})
}

function githubLogin(){
  // 用当前页面URL作为回调地址，GitHub回调后端后后端再跳回这里
  var myUrl=location.href.split('?')[0];
  fetch(API+'/auth/oauth/github/authorize?redirectUri='+encodeURIComponent(myUrl))
    .then(r=>r.json()).then(d=>{if(d.code===200){location.href=d.data.authorizeUrl}else{showMsg('auth-error',d.message,1)}}).catch(function(){showMsg('auth-error','网络错误',1)})
}

// ====== email code ======
var emailCd=0;
function sendEmailCode(){
  var em=document.getElementById('ec-email').value.trim();if(!em){showMsg('auth-error','请输入邮箱',1);return}
  fetch(API+'/auth/email/code/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})})
    .then(r=>r.json()).then(d=>{if(d.code===200){showMsg('auth-success','验证码已发送');emailCd=60;countdown('ec-send-btn',function(){return emailCd})}else{showMsg('auth-error',d.message,1)}}).catch(function(){showMsg('auth-error','网络错误',1)})
}
function emailCodeLogin(){
  fetch(API+'/auth/email/code/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('ec-email').value.trim(),code:document.getElementById('ec-code').value.trim()})})
    .then(r=>r.json()).then(d=>{if(d.code===200){saveLogin(d.data);showPage('page-home');renderHome()}else{showMsg('auth-error',d.message,1)}}).catch(function(){showMsg('auth-error','网络错误',1)})
}
function emailCodeRegister(){
  fetch(API+'/auth/email/code/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('ec-username').value.trim(),email:document.getElementById('ec-email').value.trim(),code:document.getElementById('ec-code').value.trim()})})
    .then(r=>r.json()).then(d=>{if(d.code===200){saveLogin(d.data);showPage('page-home');renderHome()}else{showMsg('auth-error',d.message,1)}}).catch(function(){showMsg('auth-error','网络错误',1)})
}

// ====== face login ======
function startCamera(){
  navigator.mediaDevices.getUserMedia({video:{width:640,height:480}}).then(function(stream){
    var v=document.getElementById('face-video');v.srcObject=stream;v.style.display='block';v.play();
    document.getElementById('face-capture-btn').style.display='block';
    document.getElementById('face-start-btn').style.display='none';
    document.getElementById('face-hint').textContent='请对准摄像头，点击"拍照登录"';
  }).catch(function(){showMsg('auth-error','无法打开摄像头',1)})
}
function captureFace(){
  var v=document.getElementById('face-video'),c=document.getElementById('face-canvas');
  c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.toBlob(function(blob){
    var fd=new FormData();fd.append('file',blob,'face.jpg');
    fetch(API+'/auth/face-login',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{
      if(d.code===200){saveLogin(d.data);showPage('page-home');renderHome();stopCamera()}
       else{showFaceError('face-login-error',d.message||'人脸识别失败')}
    }).catch(function(){showFaceError('face-login-error','人脸登录请求失败')})
  },'image/jpeg')
}
function faceFileLogin(){
  var f=document.getElementById('face-file').files[0];if(!f)return;
  var fd=new FormData();fd.append('file',f);
  fetch(API+'/auth/face-login',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{
    if(d.code===200){saveLogin(d.data);showPage('page-home');renderHome()}
    else{showFaceError('face-login-error',d.message||'人脸识别失败')}
  }).catch(function(){showFaceError('face-login-error','人脸登录请求失败')})
}
function stopCamera(){var v=document.getElementById('face-video');if(v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop()});v.style.display='none';document.getElementById('face-capture-btn').style.display='none';document.getElementById('face-start-btn').style.display='block'}}

// ====== forgot password ======
function showForgotPwd(){document.getElementById('forgot-box').style.display='block'}
function sendForgotCode(){
  fetch(API+'/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('fp-email').value.trim()})})
    .then(r=>r.json()).then(d=>{showMsg('auth-success','如果邮箱已注册，验证码已发送');var t=60;countdown('fp-send-btn',function(){return t})})
}
function resetPassword(){
  fetch(API+'/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('fp-email').value.trim(),code:document.getElementById('fp-code').value.trim(),newPassword:document.getElementById('fp-newpw').value})})
    .then(r=>r.json()).then(d=>{if(d.code===200){showMsg('auth-success','密码已重置，请登录');document.getElementById('forgot-box').style.display='none'}else{showMsg('auth-error',d.message,1)}})
}

// ====== home ======
function renderHome(){
  fetch(API+'/user/profile',{method:'GET',headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(d=>{
    if(d.code===200){user=d.data;document.getElementById('home-name').textContent=user.nickname||user.username;document.getElementById('home-username').textContent=user.username;document.getElementById('home-email').textContent=user.email||'';document.getElementById('home-roles').textContent=(user.roles||[]).join(', ');if(user.avatarUrl){document.getElementById('home-avatar').src=user.avatarUrl.startsWith('http')?user.avatarUrl:API+'/avatars/'+user.avatarUrl.split('/').pop()}}
  })
  loadFaceStatus()
}
function loadFaceStatus(){
  fetch(API+'/user/face',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(function(d){
    if(d.code!==200)return showFaceError('face-manage-error',d.message);
    var tag=document.getElementById('face-status-tag'),text=document.getElementById('face-status-text');
    tag.textContent=d.data.enrolled?'已录入':'未录入';tag.className='status-tag'+(d.data.enrolled?' on':'');
    text.textContent=d.data.enrolled?'已可使用人脸登录'+(d.data.enrolledAt?'，录入时间：'+d.data.enrolledAt:''):'登录前需要先为当前账号录入人脸。';
    document.getElementById('face-revoke-btn').style.display=d.data.enrolled?'block':'none';
  }).catch(function(){showFaceError('face-manage-error','无法获取人脸状态')})
}
function enrollFace(){
  var input=document.getElementById('face-enroll-file'),file=input.files[0];
  if(!file)return showFaceError('face-manage-error','请先选择 JPG 或 PNG 图片');
  var btn=document.getElementById('face-enroll-btn'),fd=new FormData();fd.append('file',file);
  btn.disabled=true;btn.textContent='录入中...';
  fetch(API+'/user/face/enroll',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd}).then(r=>r.json()).then(function(d){
    if(d.code===200){showMsg('face-manage-success','人脸录入成功');input.value='';loadFaceStatus()}
    else showFaceError('face-manage-error',d.message||'人脸录入失败');
  }).catch(function(){showFaceError('face-manage-error','人脸录入请求失败')}).finally(function(){btn.disabled=false;btn.textContent='录入/更新人脸'})
}
function revokeFace(){
  if(!confirm('确认撤销当前账号的人脸信息？'))return;
  fetch(API+'/user/face',{method:'DELETE',headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(function(d){
    if(d.code===200){showMsg('face-manage-success','人脸已撤销');loadFaceStatus()}
    else showFaceError('face-manage-error',d.message||'撤销失败');
  }).catch(function(){showFaceError('face-manage-error','撤销请求失败')})
}
function doLogout(){
  fetch(API+'/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+token}}).then(function(){token='';refreshToken='';user=null;showPage('page-auth')})
}

// ====== helpers ======
// 调试页仅保存在内存中，刷新即退出。正式前端请交给统一状态库管理。
function saveLogin(data){token=data.token;refreshToken=data.refreshToken}
function showFaceError(id,msg){
  var text=String(msg||'操作失败');
  if(text.indexOf('AccessDenied')>=0||text.indexOf('oss:PutObject')>=0)text='阿里云 OSS 权限不足：当前 AccessKey 需要该 Bucket 的 PutObject、GetObject、DeleteObject 权限。';
  else if(text.indexOf('InvalidImage.NotFoundFace')>=0)text='图片中未检测到清晰正脸，请使用光线充足、无遮挡的正面照片。';
  else if(text.indexOf('InvalidTimeStamp')>=0)text='人脸服务请求时间戳异常，请检查服务器时间。';
  else if(text.indexOf('please init instance')>=0)text='阿里云人脸库尚未初始化。';
  var e=document.getElementById(id);e.textContent=text;e.style.display='block';
}
function countdown(btnId,getRemain){
  var btn=document.getElementById(btnId),orig=btn.textContent;
  function tick(){var r=getRemain();if(r<=0){btn.textContent=orig;btn.disabled=false;return}btn.textContent=r+'s';btn.disabled=true;timerId=setTimeout(tick,1000)}
  tick()
}

</script>
